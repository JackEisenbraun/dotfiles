# Yazi config file

[mgr]
show_hidden = true

[preview]
image_filter = "lanczos3"
image_quality = 75
max_width = 600
max_height = 900

[opener]
edit = [
  { run = 'nvim "%s"', block = true, desc = "NeoVim", for = "unix" },
]
extract = [
  { run = '7zz x %s', desc = "Extract here", block = true, for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.zip", use = "extract" },
  { url = "*.py", use = "edit" },
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "inode/x-empty", use = "edit" },
  { mime = "*", use = "edit" },
  { mime = ".toml", use = "edit"},
]

[flavor]
dark = "catppuccin-macchiato"
