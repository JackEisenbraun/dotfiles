  { name = ".github", text = "󰊤", fg = "#c58fff" },
  { name = ".kube", text = "", fg = "#c58fff" },
  { name = ".npm", text = "", fg = "#c58fff" },
  { name = "Blender", text = "", fg = "#8eb5f5" },
  { name = "Desktop", text = "", fg = "#8eb5f5" },
  { name = "Development", text = "", fg = "#8eb5f5" },
  { name = "Documents", text = "", fg = "#8eb5f5" },
  { name = "Downloads", text = "", fg = "#8eb5f5" },
  { name = "Library", text = "", fg = "#8eb5f5" },
  { name = "Movies", text = "", fg = "#8eb5f5" },
  { name = "Music", text = "", fg = "#8eb5f5" },
  { name = "Pictures", text = "", fg = "#8eb5f5" },
  { name = "Postman", text = "", fg = "#8eb5f5" },
  { name = "Public", text = "", fg = "#8eb5f5" },
  { name = "Videos", text = "", fg = "#8eb5f5" },
