conds = [
  # Special files
  { if = "orphan", text = "", fg = "#d8d8dc" },
  { if = "link", text = "", fg = "#575861" },
  { if = "block", text = "", fg = "#ffbb88" },
  { if = "char", text = "", fg = "#ffbb88" },
  { if = "fifo", text = "", fg = "#ffbb88" },
  { if = "sock", text = "", fg = "#ffbb88" },
  { if = "sticky", text = "", fg = "#ffbb88" },
  { if = "dummy", text = "", fg = "#f57373" },

  # Fallback
  { if = "dir & hovered", text = "", fg = "#c58fff" },
