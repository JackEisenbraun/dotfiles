#Yazi config file

[manager]
show_hidden = true



[preview]
image_filter = "lanczos3"
image_protocol = "ueberzug"
image_quality = 75
max_width = 600
max_height = 900

[opener]
edit = [
  { run = 'zeditor %s', desc = "Zed" },
]

[open]
prepend_rules = [
  { url = "*.py", use = "edit" },
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "inode/x-empty", use = "edit" },
  { mime = "*", use = "edit" },
]


[flavor]
dark = "rose-pine"
