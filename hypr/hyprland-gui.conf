# Generated by HyprMod

# Environment
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,22

# Settings
decoration:dim_inactive = true
decoration:dim_strength = 0.4
decoration:inactive_opacity = 0.8
decoration:rounding = 12
general:allow_tearing = true
general:gaps_out = 10
general:resize_on_border = true
input:natural_scroll = true
input:scroll_factor = 0.4
input:sensitivity = -0.1
input:touchpad:middle_button_emulation = true
input:touchpad:natural_scroll = true

# Keybinds
unbind = SUPER, M
bind = SUPER ALT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
