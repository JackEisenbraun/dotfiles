# this is the start of my terminal rice
# font_family JetBrainsMonoNL.tff


# BEGIN_KITTY_FONTS
font_family      family='JetBrains Mono NL' style=Medium
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 18.0
# END_KITTY_FONTS

#Cursor Customization
cursor #0cd087
cursor_text_color #0cc087
cursor_shape underline
cursor_underline_thickness 3.0
cursor_shape_unfocused underline
#End Cursor Customization

# Shell Integration Stuff
shell_integration no-cursor

# Color Scheming
# foreground #A9B1DC
# background #1A1b2c
background_opacity .85
#End Color Scheming

# zsh launch
 shell /bin/zsh


confirm_os_
indow_close 0


# BEGIN_KITTY_THEME
# Snazzy
include current-theme.conf
# END_KITTY_THEME
